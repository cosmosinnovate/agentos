services:
  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: agentos-postgres
    environment:
      POSTGRES_DB: agentos
      POSTGRES_USER: agentos
      POSTGRES_PASSWORD: agentos_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U agentos -d agentos" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Backend (NestJS Control Plane API) ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentos-backend
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: development
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: agentos
      DATABASE_USER: agentos
      DATABASE_PASSWORD: agentos_secret
      MOCK_MODE: "true"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      # Add your real provider credentials below:
      # OPENAI_API_KEY: ""
      # ANTHROPIC_API_KEY: ""
      # GEMINI_API_KEY: ""
      # GCP_PROJECT_ID: ""
      # AWS_ACCESS_KEY_ID: ""
      # AWS_SECRET_ACCESS_KEY: ""
      # AWS_REGION: "us-east-1"
      # Settings Encryption Key (must be 32 bytes for AES-256)
      ENCRYPTION_KEY: "super_secret_encryption_key_change_me"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src # Hot reload in dev
      - /app/node_modules
      - ./logs:/app/logs
    restart: unless-stopped

  # ─── Frontend (Next.js Agent Studio) ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentos-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3001/api/v1"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    name: agentos-postgres-data
